#######################################################################
# Pete Panel – Apache perf profile
# Host: 32 GB RAM / 8 vCPU (e.g. Hetzner CCX33 class)
# Container: apache (mem_limit ≈ 3072M, cpus ≈ 1.2)
#
# Goal:
#   • Serve ~20,000 cached page hits/minute (≈ 330 req/s)
#   • Use mpm_event for high concurrency without starving PHP-FPM
#   • Keep memory predictable with ModSecurity + HTTP/2 enabled
#
# Same Apache CPU slice as the 16ram-6cpu profile (the extra host CPU
# goes to PHP-FPM, which is the real bottleneck), but with FPM able to
# absorb 72 workers we allow more front-door concurrency.
#######################################################################

# ------------------------------
# 0) Safety/timeouts & I/O
# ------------------------------
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
# Avoid Docker volume/sendfile edge cases
EnableSendfile Off
EnableMMAP     Off

# ------------------------------
# 1) MPM Event – connection/thread model
# Keep Apache CPU light; PHP-FPM does the heavy lifting.
# 8 children × 64 threads = 512 MaxRequestWorkers (cheap keep-alives/H2).
# PHP-FPM pm.max_children = 72 in the php container; Apache holds more
# because most requests hit cached/static content and return quickly.
# ------------------------------
<IfModule mpm_event_module>
  StartServers               3

  ServerLimit                8
  ThreadsPerChild           64
  MaxRequestWorkers        512

  MinSpareThreads          128
  MaxSpareThreads          256

  # Recycle workers to avoid memory growth under long-lived H2 sessions
  MaxConnectionsPerChild 20000

  # KeepAlive: short but generous enough for H2 multiplexing
  KeepAlive On
  KeepAliveTimeout 2
  MaxKeepAliveRequests 500
</IfModule>

# ------------------------------
# 2) Core hardening & small wins
# ------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size

# ------------------------------
# 3) HTTP/2 tuning (no server push)
# WooCommerce → many concurrent small objects; keep stream cap reasonable.
# ------------------------------
<IfModule http2_module>
  Protocols h2 http/1.1
  ProtocolsHonorOrder On

  # Stream/session controls: keep memory per session modest
  H2MaxSessionStreams 100
  # Maximum number of bytes buffered in memory for a stream (256 KiB)
  H2StreamMaxMemSize 262144
  H2WindowSize 6291456
</IfModule>

# ------------------------------
# 4) Compression (gzip; brotli if available)
# Skip already-compressed types to save CPU.
# ------------------------------
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE \
    text/html text/plain text/css text/xml text/javascript \
    application/javascript application/json application/xml \
    image/svg+xml
  SetEnvIfNoCase Request_URI "\.(?:gif|jpe?g|png|webp|avif|ico|pdf|zip|gz|bz2|7z|mp4|mp3|woff2?)$" no-gzip
</IfModule>

<IfModule brotli_module>
  BrotliCompressionQuality 5
  AddOutputFilterByType BROTLI_COMPRESS \
    text/html text/plain text/css text/xml text/javascript \
    application/javascript application/json application/xml \
    image/svg+xml
</IfModule>

# ------------------------------
# 5) Client-side caching for static assets
# Long TTL on versioned assets; default sane cache otherwise.
# ------------------------------
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css                       "access plus 1 year"
  ExpiresByType application/javascript         "access plus 1 year"
  ExpiresByType image/svg+xml                  "access plus 1 year"
  ExpiresByType image/avif                     "access plus 1 year"
  ExpiresByType image/webp                     "access plus 1 year"
  ExpiresByType image/png                      "access plus 1 year"
  ExpiresByType image/jpeg                     "access plus 1 year"
  ExpiresByType image/gif                      "access plus 1 year"
  ExpiresByType font/woff2                     "access plus 1 year"
  ExpiresDefault                               "access plus 1 month"
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(?:css|js|svg|avif|webp|png|jpe?g|gif|woff2?)$">
    Header unset ETag
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
</IfModule>

# ------------------------------
# 6) ModSecurity – skip static to save CPU
# ------------------------------
<IfModule security2_module>
  <LocationMatch "\.(?:ico|gif|jpe?g|png|svg|avif|webp|css|js|woff2?)$">
    SecRuleEngine Off
  </LocationMatch>
</IfModule>

# ------------------------------
# 7) Cheap DoS safety valves
# ------------------------------
<IfModule mod_reqtimeout.c>
  RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

<IfModule mod_ratelimit.c>
  # Example throttle for very large downloads (disabled by default)
  # <LocationMatch "\.(?:zip|tar|gz|bz2|7z|mp4)$">
  #   SetOutputFilter RATE_LIMIT
  #   SetEnv rate-limit 512
  # </LocationMatch>
</IfModule>

# ------------------------------
# 8) WooCommerce hot paths – relax ModSecurity to avoid checkout stalls
# ------------------------------
<IfModule security2_module>
  # Very dynamic endpoints – we use DetectionOnly for staging.
  <LocationMatch "^/(cart|checkout|my-account)(/.*)?$">
    SecRuleEngine Off
  </LocationMatch>

  <Location "/wp-admin/admin-ajax.php">
    SecRuleEngine Off
  </Location>

  # Woo REST endpoints (extensions, some checkout flows)
  <LocationMatch "^/wp-json/wc/">
    SecRuleEngine Off
  </LocationMatch>
</IfModule>

# --- Divi/large AJAX & REST friendly timeouts ---
Timeout 300
ProxyTimeout 300

# ------------------------------
# 9) Logging (keep lean in production)
# ------------------------------
LogLevel warn
# Consider rotating frequently via logrotate (already configured in image)
