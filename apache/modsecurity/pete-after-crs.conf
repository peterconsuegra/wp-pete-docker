# =====================================================================
# Pete Panel – ModSecurity exclusions that must load AFTER the OWASP CRS
# rules, because they change the rules themselves (SecRuleUpdateTarget*).
# modsecurity-apache.conf includes this file right after
# /etc/modsecurity/rules/*.conf. Request-time exclusions (ctl:...) stay in
# whitelist.conf, which loads before the CRS.
# =====================================================================

# TikTok pixel session cookies (ttcsid, ttcsid_<pixel ID>) hold random IDs.
# When one contains "--", libinjection reads it as an SQL comment and rule
# 942100 answers 403 on every page until the cookie changes. Seen on
# saveaplaya.org and saveaplaya.co 2026-09-15..29: about 33 real visitors.
# No server code reads these cookies (TikTok's own script does), so they
# leave the SQL-injection rules only; every other rule still inspects them.
# ModSecurity 2.9 ignores a regex target in ctl:ruleRemoveTargetByTag
# (tested), hence the configuration-time form here.
SecRuleUpdateTargetByTag "attack-sqli" "!REQUEST_COOKIES:/^ttcsid/"
