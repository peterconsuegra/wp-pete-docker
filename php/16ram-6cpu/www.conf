[www]
; =====================================================================
; Pete Panel – PHP-FPM pool (production, 16GB / 6 vCPU host)
; Container: php  (mem_limit ≈ 4096M, cpus ≈ 3.0)
;
; Targets:
;   • ~60–85 RPS on Woo checkout (well cached)
;   • ~36 concurrent PHP workers (memory-bound, same as 16ram-4cpu)
;   • Extra CPU vs the 4-CPU profile → warmer pool + faster ramp-up
;
; memory_limit in php.ini = 1024M
; → if you see OOM: reduce pm.max_children OR memory_limit.
; =====================================================================

user  = www-data
group = www-data

; --- listen (Apache proxy via :9000) ---
listen = 0.0.0.0:9000
listen.backlog = 512
listen.owner  = www-data
listen.group  = www-data
listen.mode   = 0660

; ================= Process Manager =================
; Assumptions:
;   • PHP container cgroup: ~4GB  (this is the binding constraint)
;   • Typical Woo/Laravel request: ~100–180MB RSS per worker
;   → 36 workers is a good balance between concurrency and memory safety.
;     The 3.0 CPU quota can drain 36 workers comfortably, so we keep a
;     warmer pool than the 4-CPU profile instead of adding children.
;
; If you see:
;   • High CPU but low memory → you can push pm.max_children up a bit.
;   • OOM / swapping → reduce pm.max_children to 30 or 24.
pm = dynamic

; Max concurrent PHP workers (memory-bound; do NOT scale with CPU)
pm.max_children = 36

; Warm pool on boot (~40% of max_children — extra CPU makes this cheap)
pm.start_servers = 14

; Idle worker bounds
pm.min_spare_servers = 12
pm.max_spare_servers = 20

; Fast ramp-up under sudden load (checkout bursts)
pm.max_spawn_rate = 16

; Recycle workers periodically to avoid leaks in plugins
pm.max_requests = 1000

; --- timeouts / stability ---
; Keep in sync with php.ini max_execution_time (300s).
; Payment gateways can be slow under load.
request_terminate_timeout = 300s

; Log slow requests to identify heavy plugins/queries
request_slowlog_timeout   = 5s
slowlog = /var/log/php-fpm/slowlog.log

; --- status/health (keep for metrics) ---
pm.status_path = /fpm-status
ping.path      = /fpm-ping

; --- env pass-through (optional) ---
; env[APP_ENV] = production

; --- file/resource limits (Docker ulimit: nofile=131072) ---
; Uncomment if you ever hit "too many open files":
; rlimit_files = 8192
; rlimit_core  = 0

; --- pool-level logging (optional) ---
; php_admin_value[error_log] = /var/log/php/error.log
; php_admin_flag[log_errors] = on
